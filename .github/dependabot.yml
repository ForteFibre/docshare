version: 2

updates:
  # pnpm ワークスペース（ルート・apps/*・packages/*）
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Tokyo
    cooldown:
      default-days: 3
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    open-pull-requests-limit: 10
    groups:
      # バージョンを揃える必要があるパッケージ群は major も含めてまとめる（先にマッチしたグループが優先されるため先頭に置く）
      react:
        patterns:
          - react
          - react-dom
          - '@types/react'
          - '@types/react-dom'
      aws-sdk:
        patterns:
          - '@aws-sdk/*'
      tanstack:
        patterns:
          - '@tanstack/*'
      # minor / patch はまとめて 1 PR にする。major は個別 PR
      npm-production:
        dependency-type: production
        update-types:
          - minor
          - patch
      npm-development:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Tokyo
    groups:
      github-actions:
        patterns:
          - '*'

  - package-ecosystem: docker
    directories:
      - /apps/frontend
      - /apps/backend
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Tokyo
    groups:
      docker-base-images:
        patterns:
          - '*'

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Tokyo
    ignore:
      # PostgreSQL のメジャーアップグレードはデータ移行を伴うため手動で行う
      - dependency-name: postgres
        update-types:
          - version-update:semver-major
